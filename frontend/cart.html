<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Your Cart - ShopCloud</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>

  <!-- TOP BAR -->
  <div class="topbar">
    <div class="topbar-left">
      <a href="index.html" class="logo">🛒 ShopCloud</a>
    </div>
    <div class="topbar-right">
      <a href="login.html" class="top-link" id="auth-link">
        <span class="link-sub">Hello, Sign in</span>
        <span class="link-main">Account &amp; Lists</span>
      </a>
      <a href="order.html" class="top-link">
        <span class="link-sub">Returns</span>
        <span class="link-main">&amp; Orders</span>
      </a>
      <a href="cart.html" class="cart-icon">
        🛒 <span id="cart-count">0</span>
        <span class="link-main">Cart</span>
      </a>
    </div>
  </div>

  <!-- CART PAGE -->
  <div class="cart-page">

    <div class="cart-main">
      <h2>🛒 Shopping Cart</h2>
      <div id="cart-items"></div>
    </div>

    <div class="cart-summary">
      <div class="summary-box">
        <h3>Order Summary</h3>
        <div class="summary-row">
          <span>Subtotal (<span id="item-count">0</span> items)</span>
          <span id="subtotal">₹0</span>
        </div>
        <div class="summary-row">
          <span>Delivery</span>
          <span class="free">FREE</span>
        </div>
        <div class="summary-row total">
          <span>Total</span>
          <span id="total-price">₹0</span>
        </div>
        <button class="checkout-btn" id="checkout-btn" onclick="checkout()">
          Proceed to Checkout →
        </button>
        <p class="secure-note">🔒 Safe and Secure Payments</p>
      </div>
    </div>

  </div>

  <!-- FOOTER -->
  <footer>
    <div class="footer-bottom">
      <p>🛒 ShopCloud &copy; 2026 | Built on AWS | All rights reserved</p>
    </div>
  </footer>

  <!-- Cognito SDK -->
 <script src="https://cdn.jsdelivr.net/npm/amazon-cognito-identity-js@6.3.7/dist/amazon-cognito-identity.min.js"></script>

<script>
  // ===== LOAD CART FIRST — before anything else =====
  function loadCart() {
    const cart = JSON.parse(localStorage.getItem('cart') || '[]');
    const container = document.getElementById('cart-items');
    const countEl = document.getElementById('item-count');
    const subtotalEl = document.getElementById('subtotal');
    const totalEl = document.getElementById('total-price');
    const cartCountEl = document.getElementById('cart-count');

    cartCountEl.textContent = cart.length;

    if (cart.length === 0) {
      container.innerHTML = `
        <div class="empty-cart">
          <div class="empty-icon">🛒</div>
          <h3>Your cart is empty</h3>
          <p>Looks like you haven't added anything yet.</p>
          <a href="index.html" class="continue-btn">Continue Shopping</a>
        </div>`;
      document.getElementById('checkout-btn').style.display = 'none';
      countEl.textContent = '0';
      subtotalEl.textContent = '₹0';
      totalEl.textContent = '₹0';
      return;
    }

    let total = 0;
    container.innerHTML = '';

    cart.forEach((item, index) => {
      total += item.price;
      container.innerHTML += `
        <div class="cart-item" id="item-${index}">
          <img 
            src="${item.image || 'https://placehold.co/80x80/f5f5f5/333?text=Product'}" 
            alt="${item.name}" 
            class="cart-item-img"
            onerror="this.src='https://placehold.co/80x80/f5f5f5/333?text=Product'"/>
          <div class="cart-item-details">
            <h4>${item.name}</h4>
            <p class="item-stock">✅ In Stock</p>
            <p class="item-delivery">FREE Delivery by Tomorrow</p>
            <button class="remove-btn" onclick="removeItem(${index})">🗑️ Remove</button>
          </div>
          <div class="cart-item-price">₹${item.price.toLocaleString()}</div>
        </div>`;
    });

    countEl.textContent = cart.length;
    subtotalEl.textContent = '₹' + total.toLocaleString();
    totalEl.textContent = '₹' + total.toLocaleString();
  }

  function removeItem(index) {
    let cart = JSON.parse(localStorage.getItem('cart') || '[]');
    cart.splice(index, 1);
    localStorage.setItem('cart', JSON.stringify(cart));
    loadCart();
  }

  function checkout() {
    const user = JSON.parse(localStorage.getItem('shopcloud_user') || '{}');
    if (!user.email) {
      alert('Please sign in to proceed to checkout!');
      window.location.href = 'login.html';
      return;
    }
    window.location.href = 'checkout.html';
  }

  // Run cart immediately
  loadCart();

  // ===== COGNITO — runs after cart loads =====
  const poolData = {
    UserPoolId: 'ap-south-1_zWnAt9zu0',
    ClientId: '795g14phrivadirpbnoefu8j9c'
  };
  const userPool = new AmazonCognitoIdentity.CognitoUserPool(poolData);
  const currentUser = userPool.getCurrentUser();

  if (currentUser) {
    currentUser.getSession((err, session) => {
      if (!err && session.isValid()) {
        const user = JSON.parse(localStorage.getItem('shopcloud_user') || '{}');
        const link = document.getElementById('auth-link');
        if (link && user.name) {
          link.querySelector('.link-sub').textContent = 'Hello, ' + user.name.split(' ')[0];
          link.querySelector('.link-main').textContent = 'Account & Lists';
          link.href = '#';
          link.onclick = function() {
            if (confirm('Do you want to sign out?')) {
              currentUser.signOut();
              localStorage.removeItem('shopcloud_token');
              localStorage.removeItem('shopcloud_user');
              window.location.reload();
            }
          };
        }
      }
    });
  }
</script>

</body>
</html>
